name: NEXUS CI Suite

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  test-and-build:
    name: Build & Automated Tests
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgrespassword
          POSTGRES_DB: nexus_payroll_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run prisma:generate

      - name: Push Database Schema
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/nexus_payroll_test?schema=public"
        run: npm run prisma:push

      - name: Seed Test Database
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/nexus_payroll_test?schema=public"
        run: npm run prisma:seed

      - name: Run Test Suite (Unit, RBAC, and E2E Lifecycle)
        env:
          DATABASE_URL: "postgresql://postgres:postgrespassword@localhost:5432/nexus_payroll_test?schema=public"
          JWT_SECRET: "ci_secret_test_key"
        run: npm test

      - name: Build Full Stack (Backend + Frontend)
        run: npm run build
